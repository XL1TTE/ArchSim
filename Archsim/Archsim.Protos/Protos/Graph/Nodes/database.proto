syntax = "proto3";
package archsim.core;

import "Graph/slots.proto";

option csharp_namespace = "Archsim.Proto.Core";

message DatabaseNode {
  repeated DatabaseOperation operations = 1;

  oneof streaming_capability {
    NoStreaming no_streaming = 2;
    Streaming streaming = 3;
  }
}

message DatabaseOperation {
  string tag = 1;

  oneof access_mode {
    ReadAccess read = 2;
    WriteAccess write = 3;
  }
}

message ReadAccess {}

message WriteAccess {}

message NoStreaming {}

message Streaming {
  OutboundSlot slot = 1;
}
