syntax = "proto3";
package archsim.arch;

import "Arch/plugs.proto";

option csharp_namespace = "Archsim.Data.Arch";

message ServiceNode {
  string id = 1;
  string name = 2;
  string description = 3;

  repeated ServiceOperation operations = 4;
}

message ServiceOperation {
  string trigger_tag = 1;
  ExecutionPipeline pipeline = 2;
}

message ExecutionPipeline {
  repeated PipelineStage stages = 1;
}

message PipelineStage {
  OutboundPlug plug = 1;
}
