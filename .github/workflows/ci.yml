name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ArchSim.slnx

      - name: Build solution
        run: dotnet build ArchSim.slnx --no-restore --configuration Release

  frontend:
    name: Build & Verify Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Archsim/WebClient
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Archsim/WebClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate RPC contracts from Proto
        run: npm run generate:rpc

      - name: Check for uncommitted contract drift
        run: git diff --exit-code src/contracts/rpc

      - name: Type-check and build frontend
        run: npm run build
